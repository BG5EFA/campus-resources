<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 · 温州市滨海高级中学</title>
<style>
  :root{--blue:#2f7bff;--blue-d:#1346c7;--cyan:#35d0ff;--bg1:#eef5ff;--bg2:#dcebff;--card:#fff;
    --text:#14233f;--muted:#6b7c9c;--line:#d4e3ff;--glow:rgba(47,123,255,.22)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);position:relative;overflow-x:hidden;min-height:100vh;padding:0 12px 70px;background:linear-gradient(165deg,#eef5ff,#dcebff 55%,#e9f1ff)}
  .wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 4px 2px}
  .btn-ghost{background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--blue-d);border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer}
  .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:30px;padding:5px 6px 5px 12px}
  .user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .user-chip .nm{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav{display:flex;gap:6px;justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
  .nav a{font-size:13px;padding:6px 13px;border-radius:18px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.7)}
  .nav a.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;box-shadow:0 4px 12px var(--glow)}
  header{text-align:center;padding:6px 0}
  .badge{width:60px;height:60px;filter:drop-shadow(0 6px 16px var(--glow))}
  .title{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--blue-d),var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .profile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(47,123,255,.10)}
  .profile .big-av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;flex:0 0 auto}
  .profile .info .nm{font-size:18px;font-weight:700}
  .profile .info .uid{font-size:13px;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:8px;margin:6px 0 12px}
  .tabs button{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;color:var(--muted);cursor:pointer;position:relative}
  .tabs button.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;font-weight:600}
  .tabs button .dot{position:absolute;top:6px;right:10px;background:#ff5b5b;color:#fff;border-radius:10px;font-size:10px;padding:0 5px;min-width:16px;height:16px;line-height:16px}
  .panel{display:none}
  .panel.active{display:block}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 4px 14px rgba(47,123,255,.06);position:relative;overflow:hidden}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
  .item .h{font-size:15px;font-weight:700}
  .item .ex{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .st{font-size:11px;border-radius:8px;padding:2px 8px}
  .st0{color:#b07d00;background:#fff4d6}.st1{color:#0a8f4d;background:#e3f9ec}.st2{color:#c0392b;background:#fde7e3}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
  .noti{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;box-shadow:0 4px 14px rgba(47,123,255,.05);position:relative}
  .noti.unread{border-color:var(--blue);background:#f5faff}
  .noti .msg{font-size:14px;line-height:1.5}
  .noti .time{font-size:11px;color:var(--muted);margin-top:4px}
  .noti .badge-un{position:absolute;right:12px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .readall{display:block;width:100%;margin:10px 0;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--blue-d);font-size:14px;cursor:pointer}
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(47,123,255,.08)}
  .form-card h3{font-size:16px;color:var(--blue-d);margin-bottom:10px}
  .form-card label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  .form-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:#f7fbff}
  .form-card input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.12)}
  .form-card .save{width:100%;margin-top:16px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;border-radius:11px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(20,35,63,.94);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.show{opacity:1}
  .mask{position:fixed;inset:0;background:rgba(10,22,46,.45);backdrop-filter:blur(3px);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(20,35,63,.3);position:relative}
  .modal h3{font-size:19px;color:var(--blue-d);text-align:center}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:#f7fbff}
  .modal .mbtn{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;border-radius:11px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  .modal .alt{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}.modal .alt a{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600}
  .modal .close{position:absolute;right:14px;top:12px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
  .captcha-row{display:flex;gap:10px;align-items:center}
  .captcha-row input{flex:1;min-width:0}
  .captcha-img{width:120px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#f7fbff}
  .captcha-img:active{transform:scale(.97)}
  .profile .info{flex:1;min-width:0}
  .nm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mini-btn{background:#f4f9ff;border:1px solid var(--line);color:var(--blue-d);border-radius:9px;padding:6px 12px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-block}
  .mini-btn:hover{background:#e6f1ff}
  .quick-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .quick-row .mini-btn{flex:1;min-width:100px;text-align:center;padding:10px 8px;font-size:13px}
  .stat-row{display:flex;gap:8px;margin:0 0 10px}
  .stat{flex:1;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
  .stat .n{font-size:19px;font-weight:700;color:var(--blue-d)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .inline-edit{display:none;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .inline-edit.show{display:flex}
  .inline-edit input{flex:1;min-width:130px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;outline:none;background:#f7fbff}
  .inline-edit .ok{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer}
  .inline-edit .no{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin:0 0 6px}
  .form-card .hint{margin-top:8px}
  .item .ex.full{display:block;-webkit-line-clamp:unset;white-space:pre-wrap;word-break:break-word}
  .item .item-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="authArea"><button class="btn-ghost" id="loginBtn">登录</button><button class="btn-ghost" id="regBtn">注册</button></div>
  <nav class="nav">
    <a href="index.html">校园墙</a><a href="treehole.html">树洞</a>
    <a href="forum.html">论坛</a><a href="qa.html">问答</a><a href="study.html">学习专区</a><a href="me.html" class="active">我的</a><a href="info.html">关于 / 更新</a>
  </nav>
  <header><img class="badge" src="/badge.png" alt="校徽" onerror="this.style.display='none'">
    <h1 class="title">个人中心</h1><p class="sub">我的内容 · 消息通知 · 账号设置</p></header>

  <div id="notLogin" class="profile" style="display:none;justify-content:center">
    <div class="info" style="text-align:center;width:100%">
      <div class="nm">未登录</div>
      <div class="uid">登录后查看你的内容、消息与设置</div>
    </div>
  </div>

  <div id="profileBox" style="display:none">
    <div class="profile">
      <div class="big-av" id="bigAv">?</div>
      <div class="info">
        <div class="nm-row"><span class="nm" id="pName">--</span><button class="mini-btn" id="editNickBtn">✏️ 改昵称</button></div>
        <div class="uid" id="pUid">@--</div>
        <div class="inline-edit" id="nickEdit">
          <input type="text" id="quickNick" maxlength="50" placeholder="输入新昵称">
          <button class="ok" id="quickNickSave">保存</button>
          <button class="no" id="quickNickCancel">取消</button>
        </div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="n" id="statPosts">0</div><div class="l">我发布的</div></div>
      <div class="stat"><div class="n" id="statFavs">0</div><div class="l">我收藏的</div></div>
      <div class="stat"><div class="n" id="statUnread">0</div><div class="l">未读消息</div></div>
    </div>
    <div class="quick-row">
      <button class="mini-btn" id="quickPwd">🔑 修改密码</button>
      <button class="mini-btn" id="quickPosts">📝 查看发布</button>
      <button class="mini-btn" id="quickFavs">⭐ 我的收藏</button>
    </div>

    <div class="tabs">
      <button data-tab="content" class="active">我的内容</button>
      <button data-tab="noti">消息通知<span class="dot" id="unreadDot" style="display:none">0</span></button>
      <button data-tab="setting">账号设置</button>
    </div>

    <div class="panel active" id="panel-content">
      <div class="tabs" style="margin-top:0">
        <button data-sub="all" class="active">全部</button>
        <button data-sub="post">校园墙/树洞</button>
        <button data-sub="forum">论坛</button>
        <button data-sub="qa">问答</button>
        <button data-sub="mat">资料</button>
        <button data-sub="fav">⭐ 收藏</button>
      </div>
      <div id="contentSummary" class="hint"></div>
      <div id="contentList"></div>
    </div>

    <div class="panel" id="panel-noti">
      <button class="readall" id="readAll">全部标记为已读</button>
      <div id="notiList"></div>
    </div>

    <div class="panel" id="panel-setting">
      <div class="form-card">
        <h3>✏️ 修改昵称</h3>
        <label>新昵称（最长 50 字）</label><input id="nick" placeholder="输入新昵称" maxlength="50">
        <button class="save" id="saveNickBtn">保存昵称</button>
        <div class="hint">昵称会显示在你的发布内容、评论和个人中心。</div>
      </div>
      <div class="form-card">
        <h3>🔑 修改密码</h3>
        <label>原密码</label><input id="oldpw" type="password" placeholder="原密码" autocomplete="current-password">
        <label>新密码（至少 6 位）</label><input id="newpw" type="password" placeholder="新密码" autocomplete="new-password">
        <label>确认新密码</label><input id="newpw2" type="password" placeholder="再输入一次新密码" autocomplete="new-password">
        <button class="save" id="savePwdBtn">保存密码</button>
        <div class="hint">忘记密码需联系管理员重置，请记牢新密码。</div>
      </div>
      <button class="readall" id="logoutBtn2">退出登录</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div class="mask" id="loginMask"><div class="modal">
  <span class="close" data-close="loginMask">×</span><h3>登录</h3><label>用户名</label><input type="text" id="l_user" placeholder="用户名" autocomplete="username">
  <label>密码</label><input type="password" id="l_pwd" placeholder="密码" autocomplete="current-password">
  <label>验证码</label>
  <div class="captcha-row"><input type="text" id="l_cap" placeholder="输入右侧 4 位数字" maxlength="4" autocomplete="off"><img class="captcha-img" id="l_capimg" alt="验证码，点击刷新" title="点击刷新"></div>
  <button class="mbtn" id="l_submit">登 录</button><p class="alt">还没有账号？<a id="toReg">立即注册</a></p>
</div></div>
<div class="mask" id="regMask"><div class="modal">
  <span class="close" data-close="regMask">×</span><h3>注册</h3><label>用户名（3-20位）</label><input type="text" id="r_user" placeholder="用户名" autocomplete="username">
  <label>昵称（可选）</label><input type="text" id="r_nick" placeholder="昵称" maxlength="50">
  <label>密码（至少6位）</label><input type="password" id="r_pwd" placeholder="密码" autocomplete="new-password">
  <label>邀请码（注册必填）</label><input type="text" id="r_inv" placeholder="请输入邀请码" maxlength="32" autocomplete="off">
  <label>验证码</label>
  <div class="captcha-row"><input type="text" id="r_cap" placeholder="输入右侧 4 位数字" maxlength="4" autocomplete="off"><img class="captcha-img" id="r_capimg" alt="验证码，点击刷新" title="点击刷新"></div>
  <button class="mbtn" id="r_submit">注 册</button><p class="alt">已有账号？<a id="toLogin">去登录</a></p>
</div></div>

<script>
const API='api.php';let TOKEN=localStorage.getItem('bb_token')||'',ME=null,curSub='all',myData=null;
const CAT_LBL={love:'👤 寻人',lost:'🔎 寻物',help:'🙋 求助',chat:'💬 吐槽',other:'✨ 其他'};
let curCap={login:'',reg:''};
async function loadCaptcha(kind){try{const r=await fetch(API+'?action=captcha');const d=await r.json();if(!d.ok)return;if(kind==='login'){curCap.login=d.cid;document.getElementById('l_capimg').src=d.image;document.getElementById('l_cap').value='';}else{curCap.reg=d.cid;document.getElementById('r_capimg').src=d.image;document.getElementById('r_cap').value='';}}catch(_){}}
function openAuth(kind){closeMask('loginMask');closeMask('regMask');if(kind==='login'){openMask('loginMask');loadCaptcha('login');}else{openMask('regMask');loadCaptcha('reg');}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stLabel(s){return s==1?'<span class="st st1">已通过</span>':(s==2?'<span class="st st2">已拒绝</span>':'<span class="st st0">审核中</span>');}
async function refreshUser(){if(!TOKEN){ME=null;renderAuth();return;}try{const r=await fetch(API+'?action=me&token='+encodeURIComponent(TOKEN));const d=await r.json();if(d.ok)ME=d;else{TOKEN='';localStorage.removeItem('bb_token');ME=null;}}catch(_){}renderAuth();}
function renderAuth(){const a=document.getElementById('authArea');if(ME){const L=(ME.nickname||ME.username||'?')[0].toUpperCase();a.innerHTML='<div class="user-chip"><div class="av">'+L+'</div><span class="nm">'+esc(ME.nickname)+'</span><button class="btn-ghost" id="logoutBtn">退出</button></div>';document.getElementById('logoutBtn').onclick=logout;}else{a.innerHTML='<button class="btn-ghost" id="loginBtn">登录</button><button class="btn-ghost" id="regBtn">注册</button>';document.getElementById('loginBtn').onclick=()=>openAuth('login');document.getElementById('regBtn').onclick=()=>openAuth('reg');}}
function logout(){if(TOKEN)fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=logout&token='+encodeURIComponent(TOKEN)}).catch(()=>{});TOKEN='';ME=null;localStorage.removeItem('bb_token');renderAuth();toast('已退出');location.reload();}
function openMask(id){document.getElementById(id).classList.add('show');}function closeMask(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>closeMask(x.dataset.close));
document.getElementById('toReg').onclick=()=>openAuth('reg');
document.getElementById('toLogin').onclick=()=>openAuth('login');
document.getElementById('l_capimg').onclick=()=>loadCaptcha('login');
document.getElementById('r_capimg').onclick=()=>loadCaptcha('reg');
document.querySelectorAll('.mask').forEach(m=>m.onclick=e=>{if(e.target===m)closeMask(m.id);});
document.getElementById('l_submit').onclick=async()=>{const u=document.getElementById('l_user').value.trim(),pw=document.getElementById('l_pwd').value.trim();if(!u||!pw){toast('请填写用户名和密码');return;}const cap=document.getElementById('l_cap').value.trim();if(!cap){toast('请填写验证码');return;}const fd=new FormData();fd.append('action','login');fd.append('username',u);fd.append('password',pw);fd.append('cid',curCap.login);fd.append('captcha',cap);const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){TOKEN=d.token;localStorage.setItem('bb_token',TOKEN);ME=d;closeMask('loginMask');renderAuth();toast('登录成功');location.reload();}else{toast(d.msg);loadCaptcha('login');}};
document.getElementById('r_submit').onclick=async()=>{const u=document.getElementById('r_user').value.trim(),nick=document.getElementById('r_nick').value.trim(),pw=document.getElementById('r_pwd').value.trim(),inv=document.getElementById('r_inv').value.trim(),cap=document.getElementById('r_cap').value.trim();if(!u||!pw){toast('请填写用户名和密码');return;}if(!inv){toast('请填写邀请码');return;}if(!cap){toast('请填写验证码');return;}const fd=new FormData();fd.append('action','register');fd.append('username',u);fd.append('password',pw);if(nick)fd.append('nickname',nick);fd.append('invite',inv);fd.append('cid',curCap.reg);fd.append('captcha',cap);const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){TOKEN=d.token;localStorage.setItem('bb_token',TOKEN);ME=d;closeMask('regMask');renderAuth();toast('注册成功');location.reload();}else{toast(d.msg);loadCaptcha('reg');}};

function setTab(){document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel-'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='noti')loadNoti();if(b.dataset.tab==='setting'){document.getElementById('nick').value=ME?ME.nickname:'';}});}
setTab();
document.querySelectorAll('#panel-content .tabs button[data-sub]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#panel-content .tabs button[data-sub]').forEach(x=>x.classList.remove('active'));b.classList.add('active');curSub=b.dataset.sub;renderContent();});

function applyMe(){if(!ME)return;const name=ME.nickname||ME.username||'?';document.getElementById('bigAv').textContent=name[0].toUpperCase();document.getElementById('pName').textContent=name;document.getElementById('pUid').textContent='@'+ME.username;const a=document.getElementById('nick'),b=document.getElementById('quickNick');if(a)a.value=ME.nickname||'';if(b)b.value=ME.nickname||'';renderAuth();}
async function saveNickname(nick){nick=String(nick||'').trim();if(!nick){toast('昵称不能为空');return false;}if(nick.length>50){toast('昵称最长 50 字');return false;}const fd=new FormData();fd.append('action','profile_update');fd.append('nickname',nick);fd.append('token',TOKEN);try{const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){ME=Object.assign({},ME,{nickname:d.nickname,username:d.username});applyMe();toast('昵称已更新');return true;}toast(d.msg||'保存失败');return false;}catch(_){toast('网络错误');return false;}}
function switchTab(name,sub){const b=document.querySelector('.tabs button[data-tab="'+name+'"]');if(b)b.click();if(sub){const s=document.querySelector('#panel-content .tabs button[data-sub="'+sub+'"]');if(s)s.click();}}
function boardUrl(p){return p.board==1?'treehole.html':(p.board==2?'forum.html':'index.html');}
function metaSpan(x){const s=document.createElement('span');if(x&&typeof x==='object'){if(x.html)s.innerHTML=x.html;else s.textContent=String(x.text||'');}else s.textContent=String(x==null?'':x);return s;}
function itemShell(o){const el=document.createElement('div');el.className='item';const h=document.createElement('div');h.className='h';h.textContent=o.title||'';el.appendChild(h);if(o.body){const ex=document.createElement('div');ex.className='ex';ex.textContent=o.body;el.appendChild(ex);if(String(o.body).length>48){const t=document.createElement('button');t.className='mini-btn';t.style.cssText='margin-top:7px;padding:4px 10px;font-size:12px';t.textContent='展开全文';t.onclick=()=>{const full=ex.classList.toggle('full');t.textContent=full?'收起':'展开全文';};el.appendChild(t);}}const meta=document.createElement('div');meta.className='meta';(o.meta||[]).filter(x=>x!==''&&x!=null&&x!==false).forEach(x=>meta.appendChild(metaSpan(x)));el.appendChild(meta);const acts=document.createElement('div');acts.className='item-acts';if(o.url){const a=document.createElement('a');a.className='mini-btn';a.href=o.url;a.textContent='查看原文 ↗';a.target='_blank';a.rel='noopener';acts.appendChild(a);}(o.buttons||[]).forEach(b=>acts.appendChild(b));if(acts.children.length)el.appendChild(acts);return el;}
function updateStats(){if(!myData)return;const n=(myData.posts||[]).length+(myData.topics||[]).length+(myData.questions||[]).length+(myData.materials||[]).length;document.getElementById('statPosts').textContent=n;document.getElementById('statFavs').textContent=(myData.favorites||[]).length;}
function setSummary(t){document.getElementById('contentSummary').textContent=t;}
function fmtTime(s){if(!s)return '';return String(s).replace('T',' ').slice(0,16);}
function renderFavorites(box){
  const list=(myData&&myData.favorites)||[];
  setSummary(list.length?'共 '+list.length+' 条收藏 · 点「查看原文」可回到校园墙':'');
  if(!list.length){box.innerHTML='<div class="empty">还没有收藏，去校园墙点「☆ 收藏」吧～</div>';return;}
  box.textContent='';
  list.forEach(p=>{
    const btn=document.createElement('button');btn.className='mini-btn';btn.textContent='★ 取消收藏';
    btn.onclick=async()=>{btn.disabled=true;try{const fd=new FormData();fd.append('action','favorite_toggle');fd.append('post_id',p.id);fd.append('token',TOKEN);const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){toast(d.msg||'已取消收藏');loadMy();}else toast(d.msg||'操作失败');}catch(_){toast('网络错误');}finally{btn.disabled=false;}};
    box.appendChild(itemShell({title:p.title||'校园墙内容',body:p.content||'',meta:['收藏于 '+fmtTime(p.favorited_at||p.created_at),CAT_LBL[p.category]||'校园墙'],url:'index.html',buttons:[btn]}));
  });
}
function renderContent(){
  const box=document.getElementById('contentList');
  if(!myData){box.innerHTML='<div class="empty">加载中…</div>';return;}
  if(curSub==='fav'){renderFavorites(box);return;}
  const rows=[];
  if(curSub==='all'||curSub==='post'){(myData.posts||[]).forEach(p=>{const lbl=p.board==2?'论坛':(p.board==1?'树洞':'校园墙');rows.push({title:(p.title?p.title:lbl),body:p.content,meta:[lbl,p.status!=null?{html:stLabel(p.status)}:'',fmtTime(p.created_at)],url:boardUrl(p)});});}
  if(curSub==='all'||curSub==='forum'){(myData.topics||[]).forEach(t=>rows.push({title:t.title,body:'',meta:['论坛','💬 '+(t.reply_count||0),fmtTime(t.created_at),t.status!=null?{html:stLabel(t.status)}:''],url:'forum.html'}));}
  if(curSub==='all'||curSub==='qa'){(myData.questions||[]).forEach(q=>rows.push({title:q.title,body:'',meta:['问答','💬 '+(q.answer_count||0),fmtTime(q.created_at)],url:'qa.html'}));}
  if(curSub==='all'||curSub==='mat'){(myData.materials||[]).forEach(m=>rows.push({title:m.title,body:'',meta:['资料','⬇ '+(m.downloads||0),fmtTime(m.created_at),m.status!=null?{html:stLabel(m.status)}:''],url:'study.html'}));}
  setSummary(rows.length?'共 '+rows.length+' 条 · 点「展开全文」可看完整内容':'');
  if(rows.length===0){box.innerHTML='<div class="empty">这里还没有内容～</div>';return;}
  box.textContent='';rows.forEach(r=>box.appendChild(itemShell(r)));
}

async function loadMy(){const [r1,r2]=await Promise.all([fetch(API+'?action=my_content&token='+encodeURIComponent(TOKEN)),fetch(API+'?action=favorite_list&token='+encodeURIComponent(TOKEN))]);const d=await r1.json();if(!d.ok){toast(d.msg||'加载失败');return;}let favs=[];try{const f=await r2.json();if(f.ok)favs=f.list||[];}catch(_){}myData=d;myData.favorites=favs;updateStats();renderContent();}
async function loadNoti(){const r=await fetch(API+'?action=notifications&token='+encodeURIComponent(TOKEN));const d=await r.json();if(!d.ok){toast(d.msg||'加载失败');return;}const box=document.getElementById('notiList');const unread=d.unread||0;document.getElementById('statUnread').textContent=unread;const dot=document.getElementById('unreadDot');if(unread>0){dot.style.display='inline-block';dot.textContent=unread;}else dot.style.display='none';if(!d.notifications||d.notifications.length===0){box.innerHTML='<div class="empty">暂无消息</div>';return;}box.innerHTML='';d.notifications.forEach(n=>{const el=document.createElement('div');el.className='noti'+(n.is_read?'':' unread');el.innerHTML='<div class="msg"></div><div class="time">'+fmtTime(n.created_at)+'</div>'+(n.is_read?'':'<span class="badge-un"></span>');el.querySelector('.msg').textContent=n.message;el.onclick=async()=>{if(!n.is_read){await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=notifications_read&id='+n.id+'&token='+encodeURIComponent(TOKEN)});loadNoti();}};box.appendChild(el);});}
document.getElementById('readAll').onclick=async()=>{await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=notifications_read&token='+encodeURIComponent(TOKEN)});toast('已全部标记为已读');loadNoti();};
document.getElementById('editNickBtn').onclick=()=>{document.getElementById('quickNick').value=ME?ME.nickname:'';document.getElementById('nickEdit').classList.add('show');document.getElementById('quickNick').focus();};
document.getElementById('quickNickCancel').onclick=()=>document.getElementById('nickEdit').classList.remove('show');
document.getElementById('quickNickSave').onclick=async()=>{if(await saveNickname(document.getElementById('quickNick').value))document.getElementById('nickEdit').classList.remove('show');};
document.getElementById('quickNick').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('quickNickSave').click();});
document.getElementById('saveNickBtn').onclick=()=>saveNickname(document.getElementById('nick').value);
document.getElementById('savePwdBtn').onclick=async()=>{const oldpw=document.getElementById('oldpw').value,newpw=document.getElementById('newpw').value,cf=document.getElementById('newpw2').value;if(!oldpw){toast('请填写原密码');return;}if(newpw.length<6){toast('新密码至少 6 位');return;}if(newpw!==cf){toast('两次输入的新密码不一致');return;}const fd=new FormData();fd.append('action','profile_update');fd.append('old_password',oldpw);fd.append('new_password',newpw);fd.append('token',TOKEN);try{const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){toast('密码已修改');document.getElementById('oldpw').value='';document.getElementById('newpw').value='';document.getElementById('newpw2').value='';}else toast(d.msg||'修改失败');}catch(_){toast('网络错误');}};
document.getElementById('quickPwd').onclick=()=>{switchTab('setting');document.getElementById('oldpw').focus();};
document.getElementById('quickPosts').onclick=()=>switchTab('content','all');
document.getElementById('quickFavs').onclick=()=>switchTab('content','fav');
document.getElementById('logoutBtn2').onclick=logout;

async function init(){await refreshUser();if(!ME){document.getElementById('notLogin').style.display='flex';return;}document.getElementById('profileBox').style.display='block';applyMe();loadMy();loadNoti();}
init();
</script>
<script src="notice.js"></script>
</body>
