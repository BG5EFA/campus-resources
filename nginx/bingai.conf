# 后台专属入口：bingai.sjh3320.top/admin
# 与主站共用代码目录 /www/wwwroot/biaobai，访问 /admin 直达后台登录页
# HTTP 80 -> 强制跳转 HTTPS（保留 Let's Encrypt 验证路径）
server {
    listen 80;
    server_name bingai.sjh3320.top;
    location /.well-known/acme-challenge/ { root /www/wwwroot/biaobai; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS 443
server {
    listen 443 ssl;
    server_name bingai.sjh3320.top;
    # 复用主站证书；待下方 certbot --expand 加入本域名后即为有效证书
    ssl_certificate     /etc/letsencrypt/live/bingao.sjh3320.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bingao.sjh3320.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/wwwroot/biaobai;
    index admin.html;
    # 访问根目录或 /admin 直达后台登录页
    location / { try_files $uri $uri/ /admin.html; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location = /config.php { deny all; }
    location ~ ^/uploads/.*\.(php|phtml)$ { deny all; }
    client_max_body_size 50m;
}
