<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温州市滨海高级中学校园墙</title>
<style>
  :root{
    --blue:#2f7bff; --blue-d:#1346c7; --cyan:#35d0ff;
    --bg1:#eef5ff; --bg2:#dcebff; --card:#ffffff;
    --text:#14233f; --muted:#6b7c9c; --line:#d4e3ff;
    --glow:rgba(47,123,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text); position:relative; overflow-x:hidden;
    background:linear-gradient(165deg,#eef5ff 0%,#dcebff 55%,#e9f1ff 100%);
    min-height:100vh;padding:0 12px 70px;
  }
  /* 科技网格 + 光晕背景 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(47,123,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(47,123,255,.06) 1px,transparent 1px);
    background-size:30px 30px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%,#000,transparent 75%);
            mask-image:radial-gradient(circle at 50% 0%,#000,transparent 75%);
  }
  .bubble{position:fixed;border-radius:50%;filter:blur(1px);opacity:.35;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 30% 30%,#9fd0ff,transparent 70%);animation:float 14s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}

  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 4px 2px}
  .btn-ghost{background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--blue-d);
    border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer;backdrop-filter:blur(4px);transition:.15s}
  .btn-ghost:hover{border-color:var(--blue);box-shadow:0 4px 12px var(--glow)}
  .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);
    border:1px solid var(--line);border-radius:30px;padding:5px 6px 5px 12px;backdrop-filter:blur(4px)}
  .user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .user-chip .nm{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 顶部导航 */
  .nav{display:flex;gap:8px;justify-content:center;margin:8px 0 2px}
  .nav a{font-size:14px;padding:7px 18px;border-radius:20px;text-decoration:none;color:var(--muted);
    border:1px solid var(--line);background:rgba(255,255,255,.7)}
  .nav a.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;box-shadow:0 4px 12px var(--glow)}

  /* 头部 */
  header{text-align:center;padding:6px 0 4px;position:relative}
  .badge{width:108px;height:108px;filter:drop-shadow(0 6px 16px var(--glow))}
  .title{font-size:24px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--blue-d),var(--blue),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .mascot{position:absolute;right:6px;top:60px;width:54px;height:54px;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .mascot .tip{position:absolute;left:-78px;top:8px;background:rgba(255,255,255,.9);border:1px solid var(--line);
    color:var(--blue-d);font-size:11px;padding:3px 8px;border-radius:10px;white-space:nowrap;
    box-shadow:0 3px 8px var(--glow)}

  /* 发布框 */
  .composer{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;
    box-shadow:0 8px 24px rgba(47,123,255,.10);position:relative;overflow:hidden}
  .composer::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--blue),var(--cyan))}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;
    resize:vertical;min-height:84px;outline:none;font-family:inherit;background:#f7fbff;color:var(--text)}
  textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.12)}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .row input[type=text]{flex:1;min-width:110px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:14px;outline:none;background:#f7fbff}
  .row input[type=text]:focus{border-color:var(--blue)}
  .anon{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .anon input{width:15px;height:15px;accent-color:var(--blue)}
  .file-btn{position:relative;overflow:hidden;border:1px dashed var(--blue);color:var(--blue-d);
    border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .submit{margin-left:auto;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;
    border-radius:10px;padding:10px 24px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:0 6px 16px var(--glow);transition:.15s}
  .submit:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .preview{margin-top:8px;display:none}
  .preview img{max-width:120px;border-radius:10px;border:1px solid var(--line)}

  /* 帖子 */
  .wall{margin-top:4px}
  .post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;
    box-shadow:0 6px 18px rgba(47,123,255,.08);position:relative;overflow:hidden}
  .post::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--blue),var(--cyan))}
  .post .top{display:flex;align-items:center;gap:10px}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;flex-shrink:0}
  .post .name{font-weight:700;font-size:15px}
  .post .time{color:var(--muted);font-size:12px}
  .post .content{margin:10px 0;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  /* 配图统一缩略显示：横屏按宽度收、竖屏按高度收，点开可看原图 */
  .post .pic{display:block;margin:8px 0;border-radius:10px;
    max-width:100%;max-width:min(100%,260px);max-height:200px;
    width:auto;height:auto;object-fit:contain;background:#f4f9ff;cursor:zoom-in}
  @media(max-width:600px){ .post .pic{max-width:min(100%,200px);max-height:170px} }
  /* 点击看原图 */
  .img-mask{position:fixed;inset:0;background:rgba(12,25,45,.88);display:none;
    align-items:center;justify-content:center;z-index:120;padding:16px;cursor:zoom-out}
  .img-mask.show{display:flex}
  .img-mask img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .post .acts{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:14px;
    border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
  .post .acts button{background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:14px;display:flex;align-items:center;gap:5px;font-family:inherit}
  .post .acts .like.on{color:var(--blue-d);font-weight:600}
  .comments{margin-top:10px;display:none;border-top:1px dashed var(--line);padding-top:10px}
  .comments.show{display:block}
  .cmt{font-size:14px;line-height:1.5;margin:6px 0;padding:8px 10px;background:#f4f9ff;border-radius:10px}
  .cmt b{color:var(--blue-d)}
  .cmt-form{display:flex;gap:8px;margin-top:8px}
  .cmt-form input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;outline:none;background:#f7fbff}
  .cmt-form button{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;border-radius:9px;padding:0 14px;font-size:13px;cursor:pointer}

  .more{display:block;width:100%;margin:16px 0;padding:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;color:var(--blue-d);font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(47,123,255,.06)}
  .empty{text-align:center;color:var(--muted);padding:34px 0}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(20,35,63,.94);color:#fff;
    padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.show{opacity:1}
  /* 关于我们 / 更新日志已独立为 info.html */

  .foot{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
  .foot a{color:var(--blue);text-decoration:none}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(10,22,46,.45);backdrop-filter:blur(3px);z-index:150;
    display:none;align-items:center;justify-content:center;padding:18px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:340px;
    box-shadow:0 20px 50px rgba(20,35,63,.3);position:relative;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:19px;color:var(--blue-d);margin-bottom:4px;text-align:center}
  .modal p.h{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:#f7fbff}
  .modal input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.12)}
  .modal .mbtn{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;
    border:none;border-radius:11px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px var(--glow)}
  .modal .alt{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
  .modal .alt a{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600}
  .modal .close{position:absolute;right:14px;top:12px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
  .captcha-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .captcha-row input{flex:1}
  .captcha-img{height:42px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#f7fbff}
  .captcha-img:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="bubble" style="width:160px;height:160px;left:-30px;top:120px"></div>
<div class="bubble" style="width:110px;height:110px;right:-20px;top:320px;animation-delay:3s"></div>
<div class="bubble" style="width:90px;height:90px;left:40%;bottom:80px;animation-delay:6s"></div>

<div class="wrap">
  <!-- 内容规范公告 -->
  <div class="notice-bar" role="alert" style="margin:10px auto 0;max-width:640px;background:linear-gradient(135deg,#fff8e6,#ffefcc);border:1px solid #ffd66b;border-left:5px solid #f5a623;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;color:#8a5a00;box-shadow:0 4px 12px rgba(245,166,35,.15)">

  </div>

  <div class="topbar" id="authArea">
    <button class="btn-ghost" id="loginBtn">登录</button>
    <button class="btn-ghost" id="regBtn">注册</button>

  <nav class="nav">

    <a href="info.html">关于 / 更新</a>
  </nav>

  <header>

    <img class="badge" src="/badge.png" alt="温州市滨海高级中学校徽" onerror="this.style.display='none'">

    <h1 class="title">温州市滨海高级中学校园墙</h1>
    <p class="sub">把心动写进青春 · 匿名也可，真诚最好</p>

    <!-- 小瓜吉祥物 -->
    <svg class="mascot" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-label="小瓜">
      <ellipse cx="30" cy="12" rx="6" ry="3" fill="#34c77b" transform="rotate(-25 30 12)"/>

      <circle cx="30" cy="34" r="22" fill="#5aa0ff"/>
      <circle cx="30" cy="34" r="22" fill="none" stroke="#2f7bff" stroke-width="1.5" opacity=".5"/>

  <div class="wall" id="wall"></div>
  <button class="more" id="moreBtn" style="display:none">加载更多 ↓</button>

  <div class="foot">

  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 配图原图查看 -->
<div class="img-mask" id="imgMask"><img id="imgMaskPic" src="" alt="原图"></div>

  <div class="modal">
    <span class="close" data-close="loginMask">×</span>

<!-- 注册弹窗 -->
<div class="mask" id="regMask">
  <div class="modal">
    <span class="close" data-close="regMask">×</span>
    <h3>注册</h3>
    <p class="h">加入温州市滨海高级中学校园墙</p>
    <label>用户名（3-20位，中英文/数字/下划线）</label>
    <input type="text" id="r_user" placeholder="用户名" autocomplete="username">

<script>
const API = 'api.php';
let page = 1, loading = false, noMore = false;
let TOKEN = localStorage.getItem('bb_token') || '';
let ME = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function escName(n){ return (n || '匿名'); }
function fmtTime(s){
  const d = new Date(s.replace(' ','T')+'Z');
  if(isNaN(d)) return s;
  const diff = (Date.now()-d.getTime())/1000;
  if(diff<60) return '刚刚';
  if(diff<3600) return Math.floor(diff/60)+'分钟前';
  if(diff<86400) return Math.floor(diff/3600)+'小时前';
  return s;
}
function safeImg(name){
  if(!name) return '';
  if(!/^[a-f0-9]{32}\.(jpg|png|gif|webp)$/.test(name)) return '';
  return '/uploads/'+name;
}

// ---------- 鉴权 UI ----------
async function refreshUser(){
  if(!TOKEN){ ME = null; renderAuth(); return; }
  try{
    const r = await fetch(API+'?action=me&token='+encodeURIComponent(TOKEN));
    const d = await r.json();
    if(d.ok){ ME = d; } else { TOKEN=''; localStorage.removeItem('bb_token'); ME=null; }
  }catch(_){ ME=null; }
  renderAuth();
}
function renderAuth(){
  const area = document.getElementById('authArea');
  if(ME){
    const letter = (ME.nickname||ME.username||'?')[0].toUpperCase();
    area.innerHTML =
      '<div class="user-chip"><div class="av">'+letter+'</div>'+
      '<span class="nm">'+escName(ME.nickname)+'</span>'+
      '<button class="btn-ghost" id="logoutBtn">退出</button></div>';
    document.getElementById('logoutBtn').addEventListener('click', logout);
    // 预填昵称
    const nick = document.getElementById('nickname');
    nick.value = ME.nickname;
  } else {
    area.innerHTML =
      '<button class="btn-ghost" id="loginBtn">登录</button>'+
      '<button class="btn-ghost" id="regBtn">注册</button>';
    document.getElementById('loginBtn').addEventListener('click', ()=>openAuth('login'));
    document.getElementById('regBtn').addEventListener('click', ()=>openAuth('reg'));
    document.getElementById('nickname').value = '';
  }
}
function logout(){
  if(TOKEN){ fetch(API, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'action=logout&token='+encodeURIComponent(TOKEN)}).catch(()=>{}); }
  TOKEN=''; ME=null; localStorage.removeItem('bb_token');
  renderAuth(); toast('已退出');
}

// ---------- 验证码 ----------
let curCap = { login: '', reg: '' };
async function loadCaptcha(kind){
  try{
    const r = await fetch(API+'?action=captcha');
    const d = await r.json();
    if(d.ok){
      if(kind==='login'){ curCap.login = d.cid; document.getElementById('l_capimg').src = d.image; document.getElementById('l_cap').value=''; }
      else { curCap.reg = d.cid; document.getElementById('r_capimg').src = d.image; document.getElementById('r_cap').value=''; }
    }
  }catch(_){}
}
function openAuth(kind){
  closeMask('loginMask'); closeMask('regMask');
  if(kind==='login'){ openMask('loginMask'); loadCaptcha('login'); }
  else { openMask('regMask'); loadCaptcha('reg'); }
}

// ---------- 帖子流 ----------
async function loadPosts(reset){
  if(loading || (noMore && !reset)) return;
  loading = true;
  if(reset){ page = 1; noMore = false; document.getElementById('wall').innerHTML=''; }
  const wall = document.getElementById('wall');
  try{
    const r = await fetch(API+'?action=list&page='+page);
    const data = await r.json();
    if(!data.ok){ toast(data.msg||'加载失败'); return; }
    if(data.posts.length===0 && page===1){
      wall.innerHTML = '<div class="empty">还没有表白哦，来做第一个吧 🌟</div>';
      noMore = true;
    }
    data.posts.forEach(p=>wall.appendChild(renderPost(p)));
    if(page*data.per >= data.total) noMore = true;
    document.getElementById('moreBtn').style.display = noMore ? 'none' : 'block';
    page++;
  }catch(e){ toast('网络错误'); }
  finally{ loading = false; }
}

// 配图：点击看原图（缩略显示后仍可放大查看）
const imgMask = document.getElementById('imgMask');
function openPic(src){
  document.getElementById('imgMaskPic').src = src;
  imgMask.classList.add('show');
}
imgMask.addEventListener('click', () => imgMask.classList.remove('show'));
document.addEventListener('keydown', e => { if(e.key === 'Escape') imgMask.classList.remove('show'); });

function renderPost(p){
  const el = document.createElement('div');
  el.className = 'post';
  const avatar = (escName(p.nickname)[0]||'匿').toUpperCase();
  let html = '';
  html += '<div class="top"><div class="avatar">'+avatar+'</div>'+
          '<div><div class="name"></div><div class="time"></div></div></div>';
  html += '<div class="content"></div>';
  const img = safeImg(p.image);
  if(img) html += '<img class="pic" src="'+img+'" alt="配图" title="点击查看原图">';
  html += '<div class="acts">'+
          '<button class="like" data-id="'+p.id+'">❤ <span class="cnt">'+(p.likes||0)+'</span></button>'+
          '<button class="cmt-toggle" data-id="'+p.id+'">💬 评论 <span>'+(p.comment_count||0)+'</span></button>'+
          '</div>';
  html += '<div class="comments" data-id="'+p.id+'">'+
          '<div class="cmt-list"></div>'+
          '<div class="cmt-form"><input type="text" placeholder="说点什么…" maxlength="200">'+
          '<button>发送</button></div></div>';
  el.innerHTML = html;
  const pic = el.querySelector('.pic');
  if(pic) pic.addEventListener('click', () => openPic(pic.src));
  el.querySelector('.name').textContent = escName(p.nickname);
  el.querySelector('.time').textContent = fmtTime(p.created_at);
  el.querySelector('.content').textContent = p.content;

  el.querySelector('.like').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    try{
      const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'action=like&post_id='+p.id});
      const d = await r.json();
      if(d.ok){ btn.querySelector('.cnt').textContent = d.likes; btn.classList.add('on'); }
      else toast(d.msg);
    }catch(_){ toast('网络错误'); }
  });
  const box = el.querySelector('.comments');
  el.querySelector('.cmt-toggle').addEventListener('click', async ()=>{
    box.classList.toggle('show');
    if(box.classList.contains('show') && !box.dataset.loaded){
      await loadComments(p.id, box);
      box.dataset.loaded = '1';
    }
  });
  el.querySelector('.cmt-form button').addEventListener('click', async ()=>{
    const inp = el.querySelector('.cmt-form input');
    const v = inp.value.trim();
    if(!v) return;
    const fd = new FormData();
    fd.append('action','comment_add');
    fd.append('post_id', p.id);
    fd.append('content', v);
    if(TOKEN) fd.append('token', TOKEN);
    if(document.getElementById('anon').checked) fd.append('anonymous','1');
    const r = await fetch(API, {method:'POST', body:fd});
    const d = await r.json();
    if(d.ok){ inp.value=''; toast(d.msg); }   // 评论进入审核，不即时上屏/不计数的
    else toast(d.msg);
  });
  return el;
}

async function loadComments(id, box){
  const list = box.querySelector('.cmt-list');
  list.innerHTML = '<div class="empty" style="padding:10px">加载中…</div>';
  try{
    const r = await fetch(API+'?action=comments&post_id='+id);
    const d = await r.json();
    list.innerHTML = '';
    if(!d.ok || d.comments.length===0){ list.innerHTML='<div class="empty" style="padding:10px">还没有评论</div>'; return; }
    d.comments.forEach(c=>{
      const div = document.createElement('div');
      div.className='cmt';
      const b = document.createElement('b'); b.textContent = escName(c.nickname)+'：';
      div.appendChild(b);
      div.appendChild(document.createTextNode(c.content));
      list.appendChild(div);
    });
  }catch(_){ list.innerHTML='<div class="empty" style="padding:10px">加载失败</div>'; }
}

// ---------- 发帖 ----------
const imgInput = document.getElementById('image');
const preview = document.getElementById('preview');
const MAX_IMG = 10 * 1024 * 1024;
const IMG_TYPES = ['image/jpeg','image/png','image/gif','image/webp'];
let previewUrl = null;
function clearPreview(){ if(previewUrl){ URL.revokeObjectURL(previewUrl); previewUrl=null; } preview.style.display='none'; }
function checkImage(f){
  if(!f) return '';
  if(IMG_TYPES.indexOf(f.type) === -1) return '仅支持 jpg / png / gif / webp 图片';
  if(f.size > MAX_IMG) return '图片不能超过 10MB，请压缩后重试';
  return '';
}
imgInput.addEventListener('change', ()=>{
  clearPreview();
  const f = imgInput.files[0];
  if(!f) return;
  const err = checkImage(f);
  if(err){ imgInput.value=''; toast(err); return; }
  previewUrl = URL.createObjectURL(f);
  preview.style.display='block';
  document.getElementById('previewImg').src = previewUrl;
});

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const content = document.getElementById('content').value.trim();
  if(!content){ toast('内容不能为空'); return; }
  const imgErr = checkImage(imgInput.files[0]);
  if(imgErr){ toast(imgErr); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = imgInput.files[0] ? '上传中…' : '发布中…';
  const fd = new FormData();
  fd.append('action','create');
  fd.append('content', content);
  fd.append('nickname', document.getElementById('nickname').value.trim());
  if(document.getElementById('anon').checked) fd.append('anonymous','1');
  if(TOKEN) fd.append('token', TOKEN);
  if(imgInput.files[0]) fd.append('image', imgInput.files[0]);
  try{
    const r = await fetch(API, {method:'POST', body:fd});
    if(r.status === 413){ toast('文件过大，服务器拒绝了上传，请压缩后重试'); return; }
    let d;
    try{ d = await r.json(); }catch(_){ toast('服务器返回异常（HTTP '+r.status+'）'); return; }
    if(d.ok){ toast('提交成功，等待审核 ❤');
      document.getElementById('content').value='';
      document.getElementById('nickname').value = ME ? ME.nickname : '';
      imgInput.value=''; clearPreview();
      loadPosts(true);
    } else toast(d.msg || '发布失败，请稍后重试');
  }catch(_){ toast('网络错误，请检查网络后重试'); }
  finally{ btn.disabled=false; btn.textContent='发布'; }
});
