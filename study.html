<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习专区 · 温州市滨海高级中学</title>
<style>
  :root{
    --blue:#2f7bff; --blue-d:#1346c7; --cyan:#35d0ff;
    --bg1:#eef5ff; --bg2:#dcebff; --card:#ffffff;
    --text:#14233f; --muted:#6b7c9c; --line:#d4e3ff;
    --glow:rgba(47,123,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);position:relative;overflow-x:hidden;min-height:100vh;padding:0 12px 70px;
    background:linear-gradient(165deg,#eef5ff 0%,#dcebff 55%,#e9f1ff 100%)}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(47,123,255,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(47,123,255,.06) 1px,transparent 1px);
    background-size:30px 30px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%,#000,transparent 75%);
            mask-image:radial-gradient(circle at 50% 0%,#000,transparent 75%)}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 4px 2px}
  .btn-ghost{background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--blue-d);
    border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer;backdrop-filter:blur(4px);transition:.15s}
  .btn-ghost:hover{border-color:var(--blue);box-shadow:0 4px 12px var(--glow)}
  .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);
    border:1px solid var(--line);border-radius:30px;padding:5px 6px 5px 12px}
  .user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .user-chip .nm{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .nav{display:flex;gap:8px;justify-content:center;margin:6px 0 2px}
  .nav a{font-size:14px;padding:7px 18px;border-radius:20px;text-decoration:none;color:var(--muted);
    border:1px solid var(--line);background:rgba(255,255,255,.7)}
  .nav a.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;box-shadow:0 4px 12px var(--glow)}

  header{text-align:center;padding:6px 0 2px;position:relative}
  .badge{width:84px;height:84px;filter:drop-shadow(0 6px 16px var(--glow))}
  .title{font-size:24px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--blue-d),var(--blue),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .mascot{position:absolute;right:4px;top:46px;width:48px;height:48px;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}

  /* 上传卡片 */
  .upload{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;
    box-shadow:0 8px 24px rgba(47,123,255,.10);position:relative;overflow:hidden}
  .upload::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
  .upload h3{font-size:16px;color:var(--blue-d);margin-bottom:10px}
  .upload .f{margin-bottom:10px}
  .upload label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .upload input[type=text],.upload textarea,.upload select{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:14px;outline:none;background:#f7fbff;font-family:inherit}
  .upload textarea{min-height:64px;resize:vertical}
  .upload input[type=text]:focus,.upload textarea:focus,.upload select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.12)}
  .file-btn{display:inline-block;position:relative;overflow:hidden;border:1px dashed var(--blue);color:var(--blue-d);
    border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;background:#f4f9ff}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upload .submit{margin-top:4px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;
    border-radius:10px;padding:10px 22px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px var(--glow)}
  .login-hint{font-size:13px;color:var(--muted);background:#f4f9ff;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
  .login-hint a{color:var(--blue);cursor:pointer;font-weight:600}

  /* 筛选 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
  .chip{padding:6px 14px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--muted);
    font-size:13px;cursor:pointer;transition:.15s}
  .chip.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent}
  .filters .search{margin-left:auto;display:flex;gap:6px}
  .filters .search input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;outline:none;background:#f7fbff;width:160px}
  .filters .search button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 14px;font-size:13px;cursor:pointer}

  /* 资料网格 */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .mat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;
    box-shadow:0 6px 18px rgba(47,123,255,.08);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .mat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
  .mat .cat{display:inline-block;font-size:11px;color:var(--blue-d);background:#eaf2ff;border-radius:8px;padding:2px 8px;margin-bottom:6px;align-self:flex-start}
  .mat .mt{font-size:15px;font-weight:700;line-height:1.4;word-break:break-word}
  .mat .md{font-size:12px;color:var(--muted);margin:6px 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mat .meta{font-size:12px;color:var(--muted);margin-top:auto}
  .mat .acts{display:flex;gap:10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .mat .acts a,.mat .acts button{font-size:13px;border:none;background:none;cursor:pointer;color:var(--blue-d);text-decoration:none;display:flex;align-items:center;gap:4px}
  .mat .acts .like.on{color:var(--blue-d);font-weight:600}
  .mat .mat-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0;background:#f3f5f9;display:block;cursor:zoom-in}
  .mat .mat-img.err{display:none}
  .pic-fail{display:inline-block;margin:8px 0;padding:8px 12px;border-radius:9px;background:#f4f9ff;border:1px dashed #c9d9f0;color:#7d8ca6;font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:34px 0;grid-column:1/-1}
  .more{display:block;width:100%;margin:16px 0;padding:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;color:var(--blue-d);font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(47,123,255,.06)}

  /* 关于我们 / 赞助 */
  .about{margin:24px 0 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:22px 18px;box-shadow:0 6px 20px var(--glow);text-align:center}
  .about h3{font-size:17px;color:var(--blue-d);margin-bottom:10px;font-weight:700}
  .about p{font-size:14px;line-height:1.65;color:var(--text)}
  .about .wx{color:var(--blue);font-weight:700;letter-spacing:.5px}
  .sponsor{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin:16px 0 12px}
  .sponsor figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:7px}
  .sponsor img{width:150px;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.06)}
  .sponsor figcaption{font-size:13px;color:var(--muted)}
  .about .thanks{margin-top:6px;color:var(--blue-d);font-size:15px;font-weight:600}

  .foot{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
  .foot a{color:var(--blue);text-decoration:none}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(20,35,63,.94);color:#fff;
    padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.show{opacity:1}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(10,22,46,.45);backdrop-filter:blur(3px);z-index:150;
    display:none;align-items:center;justify-content:center;padding:18px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:340px;
    box-shadow:0 20px 50px rgba(20,35,63,.3);position:relative;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:19px;color:var(--blue-d);margin-bottom:4px;text-align:center}
  .modal p.h{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:#f7fbff}
  .modal input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.12)}
  .modal .mbtn{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;
    border:none;border-radius:11px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px var(--glow)}
  .modal .alt{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
  .modal .alt a{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600}
  .modal .close{position:absolute;right:14px;top:12px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
  .captcha-row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .captcha-row input{flex:1}
  .captcha-img{height:42px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#f7fbff}
  .captcha-img:active{transform:scale(.97)}

  @media(max-width:560px){.grid{grid-template-columns:1fr}.filters .search input{width:120px}}
</style>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="authArea">
    <button class="btn-ghost" id="loginBtn">登录</button>
    <button class="btn-ghost" id="regBtn">注册</button>
  </div>

  <nav class="nav">
    <a href="index.html">校园墙</a>
    <a href="study.html" class="active">学习专区</a>
    <a href="info.html">关于 / 更新</a>
  </nav>

  <header>
    <img class="badge" src="/badge.png" alt="校徽" onerror="this.style.display='none'">
    <h1 class="title">学习专区 · 资料分享</h1>
    <p class="sub">笔记课件 · 试卷真题 · 学习经验，一起共建共享</p>
    <svg class="mascot" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-label="小瓜">
      <ellipse cx="30" cy="12" rx="6" ry="3" fill="#34c77b" transform="rotate(-25 30 12)"/>
      <path d="M30 6 q5 -5 9 -3" stroke="#34c77b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="34" r="22" fill="#5aa0ff"/>
      <circle cx="30" cy="34" r="22" fill="none" stroke="#2f7bff" stroke-width="1.5" opacity=".5"/>
      <circle cx="22" cy="32" r="5" fill="#fff"/><circle cx="38" cy="32" r="5" fill="#fff"/>
      <circle cx="23" cy="33" r="2.4" fill="#14233f"/><circle cx="39" cy="33" r="2.4" fill="#14233f"/>
      <circle cx="16" cy="38" r="3" fill="#9fd0ff" opacity=".8"/><circle cx="44" cy="38" r="3" fill="#9fd0ff" opacity=".8"/>
      <path d="M24 42 q6 6 12 0" stroke="#14233f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="30" y="54" text-anchor="middle" font-size="9" font-weight="700" fill="#1346c7">小瓜</text>
    </svg>
  </header>

  <section class="upload" id="uploadCard">
    <h3>📤 上传学习资料</h3>
    <div id="uploadForm">
      <div class="f"><label>资料标题</label><input type="text" id="m_title" maxlength="150" placeholder="如：高一数学期中复习笔记"></div>
      <div class="f"><label>简介（可选）</label><textarea id="m_desc" maxlength="1000" placeholder="简单说明这份资料的内容…"></textarea></div>
      <div class="f"><label>分类</label><select id="m_cat"></select></div>
      <div class="f"><label>文件（≤30MB，支持 图片jpg/png/gif/webp 及 doc/pdf/ppt/xls/zip 等）</label>
        <span class="file-btn">选择文件<input type="file" id="m_file"></span>
        <span id="m_fileName" style="font-size:12px;color:var(--muted);margin-left:8px"></span>
      </div>
      <button class="submit" id="m_submit">上传（待审核）</button>
    </div>
    <div id="uploadLogin" class="login-hint" style="display:none">
      上传资料需要 <a id="toLogin2">登录</a> 后操作。
    </div>
  </section>

  <div class="filters" id="filters">
    <span class="chip active" data-cat="0">全部</span>
    <!-- 分类由 JS 填充 -->
    <div class="search">
      <input type="text" id="searchInput" placeholder="搜索资料…">
      <button id="searchBtn">搜索</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <button class="more" id="moreBtn" style="display:none">加载更多 ↓</button>

  <div class="foot">温州市滨海高级中学 · 学习专区</div>

  <section class="about">
    <h3>关于我们</h3>
    <p>微信号：<span class="wx">BG5EFA</span>，有任何建议可以找我。</p>
    <div class="sponsor">
      <figure>
        <img src="uploads/sponsor_alipay.jpg" alt="支付宝赞助收款码" loading="lazy" onerror="picFail(this)">
        <figcaption>支付宝</figcaption>
      </figure>
      <figure>
        <img src="uploads/sponsor_wechat.jpg" alt="微信支付赞助收款码" loading="lazy" onerror="picFail(this)">
        <figcaption>微信支付</figcaption>
      </figure>
    </div>
    <p class="thanks">很高兴您的赞助！</p>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="mask" id="loginMask">
  <div class="modal">
    <span class="close" data-close="loginMask">×</span>
    <h3>登录</h3><p class="h">登录后可使用上传、点赞等功能</p>
    <label>用户名</label><input type="text" id="l_user" placeholder="用户名" autocomplete="username">
    <label>密码</label><input type="password" id="l_pwd" placeholder="密码" autocomplete="current-password">
    <label>验证码</label>
    <div class="captcha-row">
      <input type="text" id="l_cap" placeholder="输入右侧 4 位数字" maxlength="4" autocomplete="off">
      <img class="captcha-img" id="l_capimg" alt="验证码" title="点击刷新">
    </div>
    <button class="mbtn" id="l_submit">登 录</button>
    <p class="alt">还没有账号？<a id="toReg">立即注册</a></p>
  </div>
</div>
<div class="mask" id="regMask">
  <div class="modal">
    <span class="close" data-close="regMask">×</span>
    <h3>注册</h3><p class="h">加入温州市滨海高级中学校园墙</p>
    <label>用户名（3-20位）</label><input type="text" id="r_user" placeholder="用户名" autocomplete="username">
    <label>昵称（可选）</label><input type="text" id="r_nick" placeholder="昵称" maxlength="50">
    <label>密码（至少6位）</label><input type="password" id="r_pwd" placeholder="密码" autocomplete="new-password">
    <label>邀请码（注册必填）</label>
    <input type="text" id="r_inv" placeholder="请输入邀请码" maxlength="32" autocomplete="off">
    <label>验证码</label>
    <div class="captcha-row">
      <input type="text" id="r_cap" placeholder="输入右侧 4 位数字" maxlength="4" autocomplete="off">
      <img class="captcha-img" id="r_capimg" alt="验证码" title="点击刷新">
    </div>
    <button class="mbtn" id="r_submit">注 册</button>
    <p class="alt">已有账号？<a id="toLogin">去登录</a></p>
  </div>
</div>

<div class="mask" id="studyGate">
  <div class="modal" style="max-width:380px;text-align:center">
    <span class="close" data-close="studyGate">×</span>
    <h3>🔒 学习专区需登录</h3>
    <p class="h">登录后即可查看和下载学习资料</p>
    <button class="mbtn" id="gateLoginBtn">去登录</button>
    <p class="alt"><a id="gateRegBtn">还没有账号？立即注册</a></p>
  </div>
</div>

<script>
const API='api.php';
function picFail(img){
  if(img.dataset.retried){img.style.display='none';if(img.parentNode&&!img.parentNode.querySelector('.pic-fail')){var t=document.createElement('div');t.className='pic-fail';t.textContent='图片暂时加载不出来，稍后刷新再试';img.parentNode.insertBefore(t,img.nextSibling);}return;}
  img.dataset.retried='1';img.src+=(img.src.indexOf('?')>=0?'&':'?')+'_r='+Date.now();
}
let TOKEN=localStorage.getItem('bb_token')||'';
let ME=null;
let curCat=0, curQ='', page=1, loading=false, noMore=false;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return (s==null?'':String(s));}

// 鉴权
async function refreshUser(){
  if(!TOKEN){ME=null;renderAuth();return;}
  try{const r=await fetch(API+'?action=me&token='+encodeURIComponent(TOKEN));const d=await r.json();
    if(d.ok)ME=d;else{TOKEN='';localStorage.removeItem('bb_token');ME=null;}}catch(_){ME=null;}
  renderAuth();
}
function renderAuth(){
  const a=document.getElementById('authArea');
  if(ME){
    const letter=(ME.nickname||ME.username||'?')[0].toUpperCase();
    a.innerHTML='<div class="user-chip"><div class="av">'+letter+'</div><span class="nm">'+esc(ME.nickname)+'</span><button class="btn-ghost" id="logoutBtn">退出</button></div>';
    document.getElementById('logoutBtn').onclick=logout;
    document.getElementById('uploadForm').style.display='block';
    document.getElementById('uploadLogin').style.display='none';
  }else{
    a.innerHTML='<button class="btn-ghost" id="loginBtn">登录</button><button class="btn-ghost" id="regBtn">注册</button>';
    document.getElementById('loginBtn').onclick=()=>{openMask('loginMask');loadCaptcha('login');};
    document.getElementById('regBtn').onclick=()=>{openMask('regMask');loadCaptcha('reg');};
    document.getElementById('uploadForm').style.display='none';
    document.getElementById('uploadLogin').style.display='block';
  }
}
function logout(){
  if(TOKEN)fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=logout&token='+encodeURIComponent(TOKEN)}).catch(()=>{});
  TOKEN='';ME=null;localStorage.removeItem('bb_token');renderAuth();toast('已退出');
}
function openMask(id){document.getElementById(id).classList.add('show');}
function closeMask(id){document.getElementById(id).classList.remove('show');}
function showStudyGate(){
  openMask('studyGate');
  const lb=document.getElementById('gateLoginBtn'), rb=document.getElementById('gateRegBtn');
  if(lb) lb.onclick=()=>{closeMask('studyGate');openMask('loginMask');loadCaptcha('login');};
  if(rb) rb.onclick=()=>{closeMask('studyGate');openMask('regMask');loadCaptcha('reg');};
}
// ---------- 验证码 ----------
let curCap={login:'',reg:''};
async function loadCaptcha(kind){
  try{
    const r=await fetch(API+'?action=captcha');
    const d=await r.json();
    if(d.ok){
      if(kind==='login'){curCap.login=d.cid;document.getElementById('l_capimg').src=d.image;document.getElementById('l_cap').value='';}
      else{curCap.reg=d.cid;document.getElementById('r_capimg').src=d.image;document.getElementById('r_cap').value='';}
    }
  }catch(_){}
}
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>closeMask(x.dataset.close));
document.getElementById('toReg').onclick=()=>{closeMask('loginMask');openMask('regMask');loadCaptcha('reg');};
document.getElementById('toLogin').onclick=()=>{closeMask('regMask');openMask('loginMask');loadCaptcha('login');};
document.querySelectorAll('.mask').forEach(m=>m.onclick=e=>{if(e.target===m)closeMask(m.id);});
document.getElementById('toLogin2').onclick=()=>{openMask('loginMask');loadCaptcha('login');};
document.getElementById('l_capimg').addEventListener('click',()=>loadCaptcha('login'));
document.getElementById('r_capimg').addEventListener('click',()=>loadCaptcha('reg'));

document.getElementById('l_submit').onclick=async()=>{
  const u=document.getElementById('l_user').value.trim(),pw=document.getElementById('l_pwd').value.trim();
  if(!u||!pw){toast('请填写用户名和密码');return;}
  const fd=new FormData();fd.append('action','login');fd.append('username',u);fd.append('password',pw);
  fd.append('cid',curCap.login);fd.append('captcha',document.getElementById('l_cap').value.trim());
  const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();
  if(d.ok){TOKEN=d.token;localStorage.setItem('bb_token',TOKEN);ME=d;closeMask('loginMask');renderAuth();toast('登录成功，欢迎 '+esc(d.nickname));document.getElementById('l_pwd').value='';
    if(document.getElementById('studyGate')?.classList.contains('show')){ closeMask('studyGate'); loadMats(true); } }
  else{toast(d.msg);loadCaptcha('login');}
};
document.getElementById('r_submit').onclick=async()=>{
  const u=document.getElementById('r_user').value.trim(),nick=document.getElementById('r_nick').value.trim(),pw=document.getElementById('r_pwd').value.trim();
  const inv=document.getElementById('r_inv').value.trim();
  if(!u||!pw){toast('请填写用户名和密码');return;}
  if(!inv){toast('请填写邀请码');return;}
  const fd=new FormData();fd.append('action','register');fd.append('username',u);fd.append('password',pw);if(nick)fd.append('nickname',nick);
  fd.append('cid',curCap.reg);fd.append('captcha',document.getElementById('r_cap').value.trim());
  fd.append('invite',inv);
  const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();
  if(d.ok){TOKEN=d.token;localStorage.setItem('bb_token',TOKEN);ME=d;closeMask('regMask');renderAuth();toast('注册成功，欢迎 '+esc(d.nickname));document.getElementById('r_user').value='';document.getElementById('r_pwd').value='';document.getElementById('r_nick').value='';document.getElementById('r_inv').value='';document.getElementById('r_cap').value='';
    if(document.getElementById('studyGate')?.classList.contains('show')){ closeMask('studyGate'); loadMats(true); } }
  else{toast(d.msg);loadCaptcha('reg');}
};

// 分类
async function loadCats(){
  try{const r=await fetch(API+'?action=material_categories');const d=await r.json();
    if(d.ok){const f=document.getElementById('filters');
      d.categories.forEach(c=>{const s=document.createElement('span');s.className='chip';s.dataset.cat=c.id;s.textContent=c.name;
        s.onclick=()=>{curCat=c.id;setActiveCat();resetList();};f.insertBefore(s,f.querySelector('.search'));});}}
  catch(_){}
  const sel=document.getElementById('m_cat');
  const r=await fetch(API+'?action=material_categories');const d=await r.json();
  if(d.ok)d.categories.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
}
function setActiveCat(){document.querySelectorAll('#filters .chip').forEach(c=>c.classList.toggle('active',+c.dataset.cat===curCat));}

// 列表
async function loadMats(reset){
  if(loading||(noMore&&!reset))return;loading=true;
  if(reset){page=1;noMore=false;document.getElementById('grid').innerHTML='';}
  const grid=document.getElementById('grid');
  try{
    let url=API+'?action=material_list&page='+page+'&category='+curCat+'&q='+encodeURIComponent(curQ);
    if(TOKEN) url+='&token='+encodeURIComponent(TOKEN);
    const r=await fetch(url);const d=await r.json();
    if(!d.ok){ if(d.msg&&d.msg.indexOf('登录')>=0){ showStudyGate(); } toast(d.msg||'加载失败'); return; }
    if(!d.ok){toast(d.msg||'加载失败');return;}
    if(d.materials.length===0&&page===1){grid.innerHTML='<div class="empty">还没有资料哦，快来分享第一份吧 📚</div>';noMore=true;}
    d.materials.forEach(m=>grid.appendChild(renderMat(m)));
    if(page*d.per>=d.total)noMore=true;
    document.getElementById('moreBtn').style.display=noMore?'none':'block';page++;
  }catch(_){toast('网络错误');}finally{loading=false;}
}
function renderMat(m){
  const el=document.createElement('div');el.className='mat';
  const ext=(m.file_type||'').toLowerCase();
  const isImg=['jpg','jpeg','png','gif','webp'].includes(ext);
  const uploader=esc(m.uploader)||'官方';
  const imgUrl=API+'?action=material_view&id='+m.id+(TOKEN?'&token='+encodeURIComponent(TOKEN):'');
  el.innerHTML=
    '<span class="cat">'+(esc(m.category_name)||'其他')+'</span>'+
    (isImg?'<img class="mat-img" src="'+imgUrl+'" loading="lazy" alt="'+esc(m.title)+'" onerror="picFail(this)">':'')+
    '<div class="mt"></div>'+
    (m.description?'<div class="md"></div>':'' )+
    '<div class="meta">'+uploader+' · '+(m.file_type||'').toUpperCase()+' · ⬇'+(m.downloads||0)+'</div>'+
    '<div class="acts">'+
      '<a class="dl" href="'+API+'?action=material_download&id='+m.id+(TOKEN?'&token='+encodeURIComponent(TOKEN):'')+'" >⬇ 下载</a>'+
      '<button class="like" data-id="'+m.id+'">❤ <span class="cnt">'+(m.likes||0)+'</span></button>'+
    '</div>';
  el.querySelector('.mt').textContent=m.title;
  if(m.description)el.querySelector('.md').textContent=m.description;
  el.querySelector('.like').onclick=async(e)=>{
    const b=e.currentTarget;
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=material_like&id='+m.id});
    const d=await r.json();
    if(d.ok){b.querySelector('.cnt').textContent=d.likes;b.classList.add('on');}else toast(d.msg);
  };
  return el;
}

// 上传
const MAX_MAT=30*1024*1024;
document.getElementById('m_file').onchange=()=>{
  const inp=document.getElementById('m_file'),f=inp.files[0];
  if(f&&f.size>MAX_MAT){inp.value='';document.getElementById('m_fileName').textContent='';toast('文件不能超过 30MB，请压缩后重试');return;}
  document.getElementById('m_fileName').textContent=f?f.name:'';
};
document.getElementById('m_submit').onclick=async()=>{
  const title=document.getElementById('m_title').value.trim();
  if(!title){toast('请填写资料标题');return;}
  const mf=document.getElementById('m_file').files[0];
  if(mf&&mf.size>MAX_MAT){toast('文件不能超过 30MB，请压缩后重试');return;}
  const fd=new FormData();fd.append('action','material_upload');fd.append('title',title);
  fd.append('description',document.getElementById('m_desc').value.trim());
  fd.append('category_id',document.getElementById('m_cat').value);
  if(TOKEN)fd.append('token',TOKEN);
  if(mf)fd.append('file',mf);
  const btn=document.getElementById('m_submit');btn.disabled=true;btn.textContent='上传中…';
  try{
    const r=await fetch(API,{method:'POST',body:fd});
    if(r.status===413){toast('文件过大，服务器拒绝了上传，请压缩后重试');return;}
    let d;try{d=await r.json();}catch(_){toast('服务器返回异常（HTTP '+r.status+'）');return;}
    if(d.ok){toast('上传成功，等待审核 ❤');document.getElementById('m_title').value='';document.getElementById('m_desc').value='';document.getElementById('m_file').value='';document.getElementById('m_fileName').textContent='';}
    else toast(d.msg||'上传失败');
  }catch(_){toast('网络错误，请检查网络后重试');}
  finally{btn.disabled=false;btn.textContent='上传（待审核）';}
};

document.getElementById('searchBtn').onclick=()=>{curQ=document.getElementById('searchInput').value.trim();resetList();};
document.getElementById('searchInput').onkeydown=e=>{if(e.key==='Enter'){curQ=e.target.value.trim();resetList();}};
document.getElementById('moreBtn').onclick=()=>loadMats(false);
function resetList(){loadMats(true);}

loadCats();refreshUser().then(()=>{ if(!ME){ showStudyGate(); } else { loadMats(true); } });
