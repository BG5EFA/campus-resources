# HTTP 80 -> 强制跳转 HTTPS（保留 Let's Encrypt 验证路径）
server {
    listen 80;
    server_name bingao.sjh3320.xyz;
    location /.well-known/acme-challenge/ { root /www/wwwroot/biaobai; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS 443
server {
    listen 443 ssl;
    server_name bingao.sjh3320.xyz;
    # 双证书并行：ECDSA 给现代设备，RSA 给老设备 / 旧版微信内核
    ssl_certificate     /etc/letsencrypt/live/bingao.sjh3320.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bingao.sjh3320.xyz/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/bingao-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bingao-rsa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头（HSTS 先用 1 天观察，稳定后再调大）
    # 注意：子 location 内一旦出现 add_header，父级不再继承，需重复声明
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /www/wwwroot/biaobai;
    index index.html;
    # 后台入口：/admin 与 /admin/ 都进入后台；直接访问 /admin.html 仍返回 404（隐藏入口）
    location = /admin { rewrite ^ /admin.html last; }
    location ^~ /admin/ { rewrite ^ /admin.html last; }
    location = /admin.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # 网站图标复用校徽，避免浏览器自动请求 /favicon.ico 得到 404
    location = /favicon.ico { rewrite ^ /badge.png last; }
    # 图片：不做 gzip（JPEG/PNG 本就是压缩格式，再压会让部分 WebView/代理解码失败）；
    # 文件不存在时直接返回 404，避免 try_files 回退成 200 的 HTML 被当成坏图
    location ~* \.(jpg|jpeg|png|gif|webp|ico)$ {
        gzip off;
        expires 1d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location = /config.php { deny all; }
    location ~ ^/uploads/.*\.(php|phtml)$ { deny all; }
    client_max_body_size 50m;
}
