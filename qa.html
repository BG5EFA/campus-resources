<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问答 · 温州市滨海高级中学</title>
<style>
  :root{--blue:#2f7bff;--blue-d:#1346c7;--cyan:#35d0ff;--bg1:#eef5ff;--bg2:#dcebff;--card:#fff;
    --text:#14233f;--muted:#6b7c9c;--line:#d4e3ff;--glow:rgba(47,123,255,.22)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);position:relative;overflow-x:hidden;min-height:100vh;padding:0 12px 70px;background:linear-gradient(165deg,#eef5ff,#dcebff 55%,#e9f1ff)}
  .wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 4px 2px}
  .btn-ghost{background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--blue-d);border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer}
  .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:30px;padding:5px 6px 5px 12px}
  .user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .user-chip .nm{font-size:14px;font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav{display:flex;gap:6px;justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
  .nav a{font-size:13px;padding:6px 13px;border-radius:18px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.7)}
  .nav a.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;box-shadow:0 4px 12px var(--glow)}
  header{text-align:center;padding:6px 0}
  .badge{width:60px;height:60px;filter:drop-shadow(0 6px 16px var(--glow))}
  .title{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--blue-d),var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .mascot{position:fixed;right:14px;bottom:14px;width:96px;height:96px;z-index:60;pointer-events:none;filter:drop-shadow(0 8px 18px var(--glow));animation:bob 3.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
  .filters .search{margin-left:auto;display:flex;gap:6px}
  .filters .search input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;outline:none;background:#f7fbff;width:160px}
  .filters .search button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 14px;font-size:13px;cursor:pointer}
  .grid{display:flex;flex-direction:column;gap:10px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(47,123,255,.08);position:relative;overflow:hidden;cursor:pointer}
  .q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--cyan))}
  .q .tt{font-size:16px;font-weight:700}
  .q .md{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .q .meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .q .solved{display:inline-block;font-size:11px;color:#fff;background:#34c77b;border-radius:8px;padding:2px 8px}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
  .more{display:block;width:100%;margin:14px 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--blue-d);font-size:14px;cursor:pointer}
  .detail .back{font-size:13px;color:var(--blue-d);cursor:pointer;margin-bottom:8px;display:inline-block}
  .detail .tt{font-size:20px;font-weight:800;margin-bottom:6px}
  .detail .meta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
  .detail .body{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;background:#f7fbff;border-radius:12px;padding:12px}
  .detail .qacts{margin:10px 0;display:flex;gap:14px;color:var(--muted);font-size:14px}
  .detail .qacts button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
  .ans{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;position:relative}
  .ans .who{font-size:13px;font-weight:600;color:var(--blue-d)}
  .ans .ct{font-size:14px;line-height:1.6;margin:6px 0;white-space:pre-wrap;word-break:break-word}
  .ans .ac{font-size:11px;color:#fff;background:#34c77b;border-radius:6px;padding:1px 6px;margin-left:6px}
  .ans .aacts{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-top:4px}
  .ans .aacts button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
  .ans .accept{background:none;border:1px solid var(--blue);color:var(--blue-d);border-radius:9px;padding:3px 10px;font-size:12px;cursor:pointer}
  .postcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(47,123,255,.10);position:relative;overflow:hidden}
  .postcard::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
  .postcard h3{font-size:16px;color:var(--blue-d);margin-bottom:10px}
  .postcard input,.postcard textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;background:#f7fbff;font-family:inherit;margin-bottom:10px}
  .postcard textarea{min-height:90px;resize:vertical}
  .postcard textarea:focus,.postcard input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.12)}
  .postcard .submit{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px var(--glow)}
  .login-hint{font-size:13px;color:var(--muted);background:#f4f9ff;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
  .login-hint a{color:var(--blue);cursor:pointer;font-weight:600}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(20,35,63,.94);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.show{opacity:1}
  .mask{position:fixed;inset:0;background:rgba(10,22,46,.45);backdrop-filter:blur(3px);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(20,35,63,.3);position:relative}
  .modal h3{font-size:19px;color:var(--blue-d);text-align:center}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:#f7fbff}
  .modal .mbtn{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:none;border-radius:11px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  .modal .alt{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}.modal .alt a{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600}
  .modal .close{position:absolute;right:14px;top:12px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
  @media(max-width:560px){.filters .search input{width:120px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="authArea"><button class="btn-ghost" id="loginBtn">登录</button><button class="btn-ghost" id="regBtn">注册</button></div>
  <nav class="nav">
    <a href="index.html">校园墙</a><a href="treehole.html">树洞</a>
    <a href="forum.html">论坛</a><a href="qa.html" class="active">问答</a><a href="study.html">学习专区</a><a href="me.html">我的</a><a href="info.html">关于 / 更新</a>
  </nav>
  <header><img class="badge" src="/badge.png" alt="校徽" onerror="this.style.display='none'">
    <h1 class="title">问答 · 情感答疑</h1><p class="sub">学习困惑、情感烦恼，学长学姐来帮你</p></header>

  <div id="listView">
    <div class="filters"><div class="search"><input id="searchInput" placeholder="搜索问题…"><button id="searchBtn">搜索</button></div></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="moreBtn" style="display:none">加载更多 ↓</button>
    <button class="btn-ghost" id="showAsk" style="display:block;width:100%;margin:10px 0">＋ 我要提问</button>
    <div class="postcard" id="askCard" style="display:none">
      <h3>🙋 我要提问</h3>
      <input id="q_title" maxlength="150" placeholder="一句话说清你的问题">
      <textarea id="q_content" maxlength="1000" placeholder="补充细节，方便大家帮你解答…"></textarea>
      <button class="submit" id="q_submit">发布问题</button>
    </div>
  </div>

  <div id="detailView" style="display:none"></div>
  <div class="toast" id="toast"></div>
</div>

<!-- 小瓜 吉祥物 -->
<svg class="mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="小瓜">
  <defs><linearGradient id="gq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#35d0ff"/></linearGradient></defs>
  <ellipse cx="60" cy="64" rx="40" ry="42" fill="url(#gq)"/>
  <path d="M60 22 Q66 8 78 14 Q70 20 64 26 Z" fill="#34c77b"/>
  <circle cx="46" cy="58" r="7" fill="#fff"/><circle cx="74" cy="58" r="7" fill="#fff"/>
  <circle cx="47" cy="59" r="3.4" fill="#14233f"/><circle cx="75" cy="59" r="3.4" fill="#14233f"/>
  <path d="M52 76 Q60 84 68 76" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <circle cx="40" cy="72" r="5" fill="#ff8fb0" opacity=".55"/><circle cx="80" cy="72" r="5" fill="#ff8fb0" opacity=".55"/>
</svg>

<div class="mask" id="loginMask"><div class="modal">
  <span class="close" data-close="loginMask">×</span><h3>登录</h3><label>用户名</label><input type="text" id="l_user" placeholder="用户名" autocomplete="username">
  <label>密码</label><input type="password" id="l_pwd" placeholder="密码" autocomplete="current-password">
  <label>验证码</label><input type="text" id="l_cap" placeholder="输入下方验证码" maxlength="6" autocomplete="off">
  <img id="l_capimg" alt="验证码，点击刷新" style="width:120px;height:40px;cursor:pointer;border:1px solid #d4e3ff;border-radius:8px;margin:4px 0 8px;display:block">
  <button class="mbtn" id="l_submit">登 录</button><p class="alt">还没有账号？<a id="toReg">立即注册</a></p>
</div></div>
<div class="mask" id="regMask"><div class="modal">
  <span class="close" data-close="regMask">×</span><h3>注册</h3><label>用户名（3-20位）</label><input type="text" id="r_user" placeholder="用户名" autocomplete="username">
  <label>昵称（可选）</label><input type="text" id="r_nick" placeholder="昵称" maxlength="50">
  <label>密码（至少6位）</label><input type="password" id="r_pwd" placeholder="密码" autocomplete="new-password">
  <label>邀请码（注册必填）</label><input type="text" id="r_inv" placeholder="请输入邀请码" maxlength="32" autocomplete="off">
  <label>验证码</label><input type="text" id="r_cap" placeholder="输入下方验证码" maxlength="6" autocomplete="off">
  <img id="r_capimg" alt="验证码，点击刷新" style="width:120px;height:40px;cursor:pointer;border:1px solid #d4e3ff;border-radius:8px;margin:4px 0 8px;display:block">
  <button class="mbtn" id="r_submit">注 册</button><p class="alt">已有账号？<a id="toLogin">去登录</a></p>
</div></div>

<script>
const API='api.php';let TOKEN=localStorage.getItem('bb_token')||'',ME=null,curQ='',page=1,loading=false,noMore=false,curQid=0,curAskerId=0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return s==null?'':String(s);}
async function refreshUser(){if(!TOKEN){ME=null;renderAuth();return;}try{const r=await fetch(API+'?action=me&token='+encodeURIComponent(TOKEN));const d=await r.json();if(d.ok)ME=d;else{TOKEN='';localStorage.removeItem('bb_token');ME=null;}}catch(_){}renderAuth();}
function renderAuth(){const a=document.getElementById('authArea');if(ME){const L=(ME.nickname||ME.username||'?')[0].toUpperCase();a.innerHTML='<div class="user-chip"><div class="av">'+L+'</div><span class="nm">'+esc(ME.nickname)+'</span><button class="btn-ghost" id="logoutBtn">退出</button></div>';document.getElementById('logoutBtn').onclick=logout;}else{a.innerHTML='<button class="btn-ghost" id="loginBtn">登录</button><button class="btn-ghost" id="regBtn">注册</button>';document.getElementById('loginBtn').onclick=()=>showLogin();document.getElementById('regBtn').onclick=()=>showReg();}}
function logout(){if(TOKEN)fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=logout&token='+encodeURIComponent(TOKEN)}).catch(()=>{});TOKEN='';ME=null;localStorage.removeItem('bb_token');renderAuth();toast('已退出');}
function openMask(id){document.getElementById(id).classList.add('show');}function closeMask(id){document.getElementById(id).classList.remove('show');}
let curCap={login:'',reg:''};
async function loadCaptcha(kind){try{const r=await fetch(API+'?action=captcha');const d=await r.json();if(!d.ok)return;if(kind==='login'){curCap.login=d.cid;document.getElementById('l_capimg').src=d.image;document.getElementById('l_cap').value='';}else{curCap.reg=d.cid;document.getElementById('r_capimg').src=d.image;document.getElementById('r_cap').value='';}}catch(_){}}
function showLogin(){openMask('loginMask');loadCaptcha('login');}
function showReg(){openMask('regMask');loadCaptcha('reg');}
document.getElementById('l_capimg').onclick=()=>loadCaptcha('login');
document.getElementById('r_capimg').onclick=()=>loadCaptcha('reg');
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>closeMask(x.dataset.close));
document.getElementById('toReg').onclick=()=>{closeMask('loginMask');showReg();};
document.getElementById('toLogin').onclick=()=>{closeMask('regMask');showLogin();};
document.querySelectorAll('.mask').forEach(m=>m.onclick=e=>{if(e.target===m)closeMask(m.id);});
document.getElementById('l_submit').onclick=async()=>{const u=document.getElementById('l_user').value.trim(),pw=document.getElementById('l_pwd').value.trim();if(!u||!pw){toast('请填写用户名和密码');return;}const fd=new FormData();fd.append('action','login');fd.append('username',u);fd.append('password',pw);fd.append('cid',curCap.login);fd.append('captcha',document.getElementById('l_cap').value.trim());const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){TOKEN=d.token;localStorage.setItem('bb_token',TOKEN);ME=d;closeMask('loginMask');renderAuth();toast('登录成功');document.getElementById('l_pwd').value='';document.getElementById('l_cap').value='';}else{toast(d.msg);loadCaptcha('login');}};
document.getElementById('r_submit').onclick=async()=>{const u=document.getElementById('r_user').value.trim(),nick=document.getElementById('r_nick').value.trim(),pw=document.getElementById('r_pwd').value.trim(),inv=document.getElementById('r_inv').value.trim();if(!u||!pw){toast('请填写用户名和密码');return;}if(!inv){toast('请填写邀请码');return;}const fd=new FormData();fd.append('action','register');fd.append('username',u);fd.append('password',pw);if(nick)fd.append('nickname',nick);fd.append('invite',inv);fd.append('cid',curCap.reg);fd.append('captcha',document.getElementById('r_cap').value.trim());const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){TOKEN=d.token;localStorage.setItem('bb_token',TOKEN);ME=d;closeMask('regMask');renderAuth();toast('注册成功');document.getElementById('r_user').value='';document.getElementById('r_pwd').value='';document.getElementById('r_nick').value='';document.getElementById('r_inv').value='';document.getElementById('r_cap').value='';}else{toast(d.msg);loadCaptcha('reg');}};

async function loadList(reset){if(loading||(noMore&&!reset))return;loading=true;if(reset){page=1;noMore=false;document.getElementById('grid').innerHTML='';}const grid=document.getElementById('grid');try{const r=await fetch(API+'?action=qa_list&page='+page+'&q='+encodeURIComponent(curQ));const d=await r.json();if(!d.ok){toast(d.msg||'加载失败');return;}if(d.questions.length===0&&page===1){grid.innerHTML='<div class="empty">还没有问题，来提第一个吧 ❓</div>';noMore=true;}d.questions.forEach(q=>grid.appendChild(renderQ(q)));if(page*d.per>=d.total)noMore=true;document.getElementById('moreBtn').style.display=noMore?'none':'block';page++;}catch(_){toast('网络错误');}finally{loading=false;}}
function renderQ(q){const el=document.createElement('div');el.className='q';const solved=q.answer_count>0?'<span class="solved">已解答 '+(q.answer_count||0)+'</span>':'';el.innerHTML='<div class="tt"></div><div class="md"></div><div class="meta"><span>'+esc(q.asker)||'匿名'+'</span><span>'+solved+'</span><span>❤ '+(q.likes||0)+'</span><span>'+(q.views||0)+' 浏览</span></div>';el.querySelector('.tt').textContent=q.title;if(q.content)el.querySelector('.md').textContent=q.content;el.querySelector('.tt').onclick=()=>showDetail(q.id);el.querySelector('.md').onclick=()=>showDetail(q.id);return el;}
function showDetail(id){document.getElementById('listView').style.display='none';const dv=document.getElementById('detailView');dv.style.display='block';dv.innerHTML='<span class="back">← 返回列表</span><div class="detail"></div>';dv.querySelector('.back').onclick=()=>{dv.style.display='none';document.getElementById('listView').style.display='block';};loadDetail(id,dv.querySelector('.detail'));}
async function loadDetail(id,box){const r=await fetch(API+'?action=qa_detail&id='+id);const d=await r.json();if(!d.ok){box.innerHTML='<div class="empty">问题不存在</div>';return;}const q=d.question;curQid=q.id;curAskerId=q.user_id;let h='<div class="tt"></div><div class="meta"><span>'+(esc(q.asker)||'匿名')+'</span><span>❤ '+(q.likes||0)+'</span><span>'+(q.views||0)+' 浏览</span><span>'+(q.answer_count||0)+' 回答</span></div><div class="body"></div><div class="qacts"><button class="qlike">❤ 赞问题</button></div><h3 style="font-size:15px;color:#1346c7;margin:12px 0 4px">全部回答（'+(d.answers.length)+'）</h3><div class="answers"></div>';box.innerHTML=h;box.querySelector('.tt').textContent=q.title;box.querySelector('.body').textContent=q.content;
  box.querySelector('.qlike').onclick=async()=>{const rr=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=qa_like&id='+id});const dd=await rr.json();if(dd.ok)toast('点赞成功');else toast(dd.msg);};
  const ans=box.querySelector('.answers');d.answers.forEach(a=>ans.appendChild(renderAns(a,box)));
  // answer form
  const form=document.createElement('div');form.style.marginTop='10px';form.innerHTML='<textarea id="atext" maxlength="800" placeholder="写下你的回答…" style="width:100%;border:1px solid #d4e3ff;border-radius:10px;padding:9px;font-size:14px;font-family:inherit;min-height:60px"></textarea><button id="abtn" style="margin-top:6px;background:linear-gradient(135deg,#2f7bff,#35d0ff);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer">回答</button>';box.appendChild(form);form.querySelector('#abtn').onclick=async()=>{if(!ME){toast('请先登录');showLogin();return;}const v=form.querySelector('#atext').value.trim();if(!v){toast('回答不能为空');return;}const fd=new FormData();fd.append('action','qa_answer');fd.append('question_id',id);fd.append('content',v);if(TOKEN)fd.append('token',TOKEN);const rr=await fetch(API,{method:'POST',body:fd});const dd=await rr.json();if(dd.ok){toast('回答成功');loadDetail(id,box);}else toast(dd.msg);};}
function renderAns(a,box){const el=document.createElement('div');el.className='ans';let tag='';if(a.accepted){tag='<span class="ac">最佳回答</span>';}el.innerHTML='<div class="who"></div><div class="ct"></div><div class="aacts"><span>❤ <b class="alc">'+(a.likes||0)+'</b></span>'+(ME&&ME.id===curAskerId?'<button class="accept">采纳</button>':'')+'</div>';el.querySelector('.who').textContent=esc(a.answerer)||'匿名';el.querySelector('.ct').textContent=a.content;const likeBtn=el.querySelector('.aacts');likeBtn.querySelector('.accept')&&(likeBtn.querySelector('.accept').onclick=async()=>{if(!ME){toast('请先登录');return;}const fd=new FormData();fd.append('action','qa_answer_accept');fd.append('answer_id',a.id);if(TOKEN)fd.append('token',TOKEN);const rr=await fetch(API,{method:'POST',body:fd});const dd=await rr.json();if(dd.ok){toast('已采纳');loadDetail(curQid,box);}else toast(dd.msg);});el.querySelector('.aacts').onclick=async(e)=>{if(e.target.classList.contains('accept'))return;const rr=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'action=qa_answer_like&id='+a.id});const dd=await rr.json();if(dd.ok)el.querySelector('.alc').textContent=dd.likes;else toast(dd.msg);};return el;}
document.getElementById('searchBtn').onclick=()=>{curQ=document.getElementById('searchInput').value.trim();loadList(true);};
document.getElementById('searchInput').onkeydown=e=>{if(e.key==='Enter'){curQ=e.target.value.trim();loadList(true);}};
document.getElementById('moreBtn').onclick=()=>loadList(false);
document.getElementById('showAsk').onclick=()=>{if(!ME){toast('请先登录');showLogin();return;}document.getElementById('askCard').style.display='block';document.getElementById('showAsk').style.display='none';};
document.getElementById('q_submit').onclick=async()=>{if(!TOKEN){toast('请先登录后再发布');showLogin();return;}const title=document.getElementById('q_title').value.trim(),content=document.getElementById('q_content').value.trim();if(!title){toast('请填写标题');return;}const fd=new FormData();fd.append('action','qa_ask');fd.append('title',title);fd.append('content',content);if(TOKEN)fd.append('token',TOKEN);const r=await fetch(API,{method:'POST',body:fd});const d=await r.json();if(d.ok){toast('发布成功');document.getElementById('q_title').value='';document.getElementById('q_content').value='';document.getElementById('askCard').style.display='none';document.getElementById('showAsk').style.display='block';loadList(true);}else toast(d.msg);};
loadList(true);refreshUser();
</script>
